name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Valores de relleno: las paginas son dinamicas y no consultan la base
      # durante el build, solo se necesita la variable definida.
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
      NEXT_PUBLIC_SITE_URL: https://jecsitoshop.vercel.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
